; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
; The default partition table splits the 4MB flash into two 1.25MB app slots so
; firmware can be OTA-updated into the spare one. Nothing in this project does
; OTA (no ArduinoOTA, no Update.h, no esp_ota_* calls), so the second slot was
; 1.25MB reserved for a feature that does not exist - and it was what put the
; build at 86% "full". huge_app.csv drops the spare slot and gives the app 3MB.
; Revert this line if OTA is ever added; min_spiffs.csv is the middle ground,
; keeping OTA with ~1.9MB per slot.
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
; AsyncTCP build flags removed - AsyncTCP/ESPAsyncWebServer are disabled below,
; so those flags were inert. CONFIG_FREERTOS_MAX_TASK_NAME_LEN was also inert:
; the Arduino framework ships a precompiled FreeRTOS, so the name limit stays
; at 16 regardless (task names are truncated to 15 chars).
build_flags =
lib_deps =
	arkhipenko/TaskScheduler@^4.0.0
	bblanchon/ArduinoJson@^6.21.5
	WiFi
	HTTPClient
	bodmer/TJpg_Decoder@^1.1.0
	adafruit/Adafruit PN532@^1.3.4
	; esp32async/ESPAsyncWebServer@^3.8.1  ; DISABLED: HTTP server to save RAM/Flash
	; esp32async/AsyncTCP@^3.4.9           ; DISABLED: HTTP server dependency
	knolleary/PubSubClient@^2.8
