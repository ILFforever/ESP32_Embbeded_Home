<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Arduino888</title>
<link rel="stylesheet" href="glass.css">
<script>
  /* Applied before first paint, so a stored preference never flashes
     the wrong theme. No attribute at all means "follow the OS".
     ?theme=dark / ?theme=light pins a page without touching the stored
     preference — used by dark.html to frame both themes at once. */
  try {
    var q = new URLSearchParams(location.search).get('theme');
    var t = (q === 'dark' || q === 'light') ? q : localStorage.getItem('arduino888-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  /* Login is the one page that centres. Everything else is top-aligned. */
  body { display: grid; place-items: center; padding: var(--s-5); }
  .login { width: min(100%, 420px); }
  /* No toolbar on this page, so the toggle floats. */
  .login__theme { position: fixed; top: 18px; right: 18px; z-index: 5; }
  .login__mark {
    width: 52px; height: 52px; border-radius: var(--r-tile);
    background: linear-gradient(150deg, #A9B9CB 0%, #8FA2B8 100%);
    display: grid; place-items: center; color: #fff; margin-bottom: var(--s-5);
    box-shadow: 0 2px 6px rgba(24,29,38,.16), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .login h1 { margin: 0; font-size: 27px; font-weight: 600; letter-spacing: -.02em; }
  .login__sub { margin: 6px 0 var(--s-6); color: var(--ink-2); font-size: 14px; }
  .login form { display: flex; flex-direction: column; gap: var(--s-4); }
  .login__foot {
    margin-top: var(--s-6); padding-top: var(--s-4);
    border-top: 1px solid var(--hairline);
    font-size: 12px; color: var(--ink-3); text-align: center;
  }
  .login__row { display: flex; align-items: center; justify-content: space-between; }
  /* padding, not just text — a standalone link needs a real target */
  .login__link { font-size: 12.5px; color: var(--accent); text-decoration: none; padding: 4px 2px; margin: -4px -2px; }
  .login__link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="g-bg" aria-hidden="true"></div>

<button class="g-theme login__theme" aria-label="Switch between light and dark" title="Switch theme">
      <svg class="g-theme__moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="g-theme__sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>

<main class="login">
  <div class="g-pane g-card" style="padding: 30px 30px 26px">
    <div class="login__mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.7V20h14V9.7"/><path d="M10 20v-5h4v5"/>
      </svg>
    </div>

    <h1>Sign in</h1>
    <p class="login__sub">Arduino888 Smart Home · residence node A</p>

    <!-- Error state. Present in the mockup so the styling is agreed;
         hide it for the happy path. Copy says what to do next. -->
    <div class="g-error" style="margin-bottom: var(--s-4)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:1px">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>
      </svg>
      <span>That email and password don't match. Check the password and try again.</span>
    </div>

    <form novalidate>
      <div class="g-field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" value="nat@example.com">
      </div>

      <div class="g-field">
        <div class="login__row">
          <label for="password">Password</label>
          <a class="login__link" href="#">Forgot password?</a>
        </div>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" value="••••••••••">
      </div>

      <button class="g-btn g-btn--primary g-btn--wide" type="submit" style="margin-top: 4px">Sign in</button>
    </form>

    <p class="login__foot">Encrypted connection to embedded-smarthome.fly.dev</p>
  </div>
</main>

<script src="glass.js" defer></script>
</body>
</html>
